name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          JAVA_VER_OUT=$(java -version 2>&1 || true)
          if [ -z "$JAVA_VER_OUT" ]; then
            echo "::error::Java could not be detected."
            exit 1
          fi
          MAJOR_VER=$(echo "$JAVA_VER_OUT" | sed -nE 's/.*version "([0-9]+)(\.[0-9]+)?.*/\1/p' | head -n 1)
          if [ -z "$MAJOR_VER" ]; then
            echo "::error::Unable to detect Java major version."
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected version $MAJOR_VER."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            KEYTOOL_BIN="keytool"
            if [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
              KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            fi
            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        id: build_apk
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        id: verify_apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::$APK_PATH is not a regular file."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::$APK_PATH is empty."
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "::error::$APK_PATH does not have the .apk extension."
              exit 1
              ;;
          esac
          echo "Verified APK: $APK_PATH"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_DIR=$(mktemp -d)
          DEST_APK="${TEMP_DIR}/app-debug.apk"
          cp "$SOURCE_APK" "$DEST_APK"
          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "::error::Failed to prepare release asset at $DEST_APK"
            exit 1
          fi
          echo "apk_path=$DEST_APK" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_APK: ${{ steps.prepare_asset.outputs.apk_path }}
        run: |
          gh --version
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::GitHub CLI (gh) is not available."
            exit 1
          fi
          if [ -z "$PREPARED_APK" ] || [ ! -f "$PREPARED_APK" ] || [ ! -s "$PREPARED_APK" ]; then
            echo "::error::Prepared APK does not exist or is empty."
            exit 1
          fi
          case "$PREPARED_APK" in
            *.apk) ;;
            *)
              echo "::error::Prepared asset does not end in .apk."
              exit 1
              ;;
          esac
          ASSET_NAME=$(basename "$PREPARED_APK")
          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "::error::Release asset filename must be app-debug.apk, got $ASSET_NAME"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES=$(printf '%s\n' \
            "This is an automatically generated debug APK." \
            "" \
            "- Built by: GitHub Actions" \
            "- GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}" \
            "- GitHub Actions Run Attempt: ${GITHUB_RUN_ATTEMPT}" \
            "- Source Commit SHA: ${GITHUB_SHA}" \
            "- This APK is intended for testing." \
            "- This APK is not a Play Store production release." \
            "- This APK is signed only with a temporary debug keystore.")

          gh release create "$RELEASE_TAG" "$PREPARED_APK" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --notes "$RELEASE_NOTES" \
            --latest

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          BUILD_OUTCOME: ${{ steps.build_apk.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.upload_artifact.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
        run: |
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            RELEASE_TITLE=$(gh release view "$RELEASE_TAG" --json name -q .name)
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: $DIRECT_URL"
            echo "Normal Actions artifact app-debug-apk remains available as a backup."
            {
              echo "### DIRECT APK DOWNLOAD"
              echo ""
              echo "$DIRECT_URL"
              echo ""
              echo "- Release Tag: $RELEASE_TAG"
              echo "- Release Title: $RELEASE_TITLE"
              echo "- APK Filename: app-debug.apk"
              echo "- Backup Actions Artifact: app-debug-apk"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed."
            if [ "$BUILD_OUTCOME" = "success" ]; then
              echo "The APK build succeeded."
            fi
            if [ "$ARTIFACT_OUTCOME" = "success" ]; then
              echo "The normal Actions artifact app-debug-apk remains available."
            fi
            {
              echo "### Release Publishing Warning"
              echo ""
              echo "GitHub Release publishing failed."
              if [ "$BUILD_OUTCOME" = "success" ]; then
                echo "- APK build succeeded."
              fi
              if [ "$ARTIFACT_OUTCOME" = "success" ]; then
                echo "- Actions artifact \`app-debug-apk\` remains available."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
